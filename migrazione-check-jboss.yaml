---
- name: Verifica JBoss (service) + check URL applicativa su porte dinamiche (curl dal controller)
  hosts: all
  become: true
  gather_facts: false

  vars:
    # Regex servizi JBoss (systemd)
    jboss_regex: '(?i)jboss.*\.service'

    # Costruzione URL applicativa
    fqdn_suffix: "syssede.systest.sanpaoloimi.com"
    app_scheme: "http"
    app_path: "/"

    # Porte da escludere
    ignore_ports: [9999, 9990]

    # Curl tuning (dal controller)
    curl_connect_timeout: 3
    curl_max_time: 5
    success_http_code: "200"

  tasks:
    ####################################################################
    # 1) Verifica servizio JBoss
    ####################################################################
    - name: Raccolta service facts
      ansible.builtin.service_facts:

    - name: Estrae servizi JBoss presenti
      ansible.builtin.set_fact:
        jboss_services: >-
          {{
            ansible_facts.services
            | dict2items
            | selectattr('key', 'match', jboss_regex)
            | list
          }}

    - name: Fallisce se nessun servizio JBoss è presente
      ansible.builtin.fail:
        msg: "❌ Nessun servizio JBoss trovato sul nodo"
      when: jboss_services | length == 0

    - name: Estrae il/i servizio/i JBoss running
      ansible.builtin.set_fact:
        jboss_running: >-
          {{
            jboss_services
            | selectattr('value.state', 'equalto', 'running')
            | list
          }}

    - name: Fallisce se JBoss non è in esecuzione
      ansible.builtin.fail:
        msg: >-
          ❌ Servizio/i JBoss presenti ma NON attivi:
          {{ jboss_services | map(attribute='key') | list }}
      when: jboss_running | length == 0

    - name: JBoss attivo – nome servizio estratto
      ansible.builtin.debug:
        msg: "✅ JBoss attivo: {{ jboss_running[0].key }}"

    ####################################################################
    # 2) Estrazione porte in LISTEN associate a processi "java"
    #    (robusta: parsing sul target via awk, niente pipe dentro 'command')
    ####################################################################
    - name: Estrae porte in LISTEN per processi java (ss + awk)
      ansible.builtin.shell: |
        set -o pipefail
        ss -H -tulnp \
        | awk '
            /java/ {
              # In ss, il campo Local Address:Port è tipicamente $5 (es: 172.40.44.16:23036)
              split($5, a, ":");
              p=a[length(a)];
              if (p ~ /^[0-9]+$/) print p;
            }
          ' \
        | sort -nu
      args:
        executable: /bin/bash
      register: java_ports_cmd
      changed_when: false

    - name: Converte porte in lista (int)
      ansible.builtin.set_fact:
        java_ports_all: "{{ java_ports_cmd.stdout_lines | map('int') | list }}"

    - name: Esclude porte 9999 e 9990
      ansible.builtin.set_fact:
        java_ports: "{{ java_ports_all | reject('in', ignore_ports) | list | sort }}"

    - name: Debug porte trovate
      ansible.builtin.debug:
        msg:
          - "Porte java trovate (tutte): {{ java_ports_all | sort }}"
          - "Porte testate (escluse {{ ignore_ports }}): {{ java_ports }}"

    - name: Fallisce se non ci sono porte java da testare
      ansible.builtin.fail:
        msg: >-
          ❌ Nessuna porta java da testare dopo esclusione {{ ignore_ports }}.
          Output estrazione porte: {{ java_ports_cmd.stdout_lines }}
      when: java_ports | length == 0

    ####################################################################
    # 3) Curl applicativo dal controller: OK se almeno una porta è HTTP 200
    ####################################################################
    - name: Costruisce host applicativo FQDN
      ansible.builtin.set_fact:
        app_host: "{{ inventory_hostname }}.{{ fqdn_suffix }}"

    - name: Curl su tutte le porte trovate (solo http_code)
      ansible.builtin.command: >-
        curl -o /dev/null -s -w "%{http_code}"
        --connect-timeout {{ curl_connect_timeout }}
        --max-time {{ curl_max_time }}
        {{ app_scheme }}://{{ app_host }}:{{ item }}{{ app_path }}
      delegate_to: localhost
      become: false
      register: curl_results
      changed_when: false
      failed_when: false
      loop: "{{ java_ports }}"


    - name: Calcola lista porte che rispondono HTTP 200
      ansible.builtin.set_fact:
        http_ok_results: "{{ curl_results.results | selectattr('stdout','equalto', success_http_code) | list }}"

    - name: Verifica se almeno una porta risponde 200 (flag + prima porta OK)
      ansible.builtin.set_fact:
        http_ok: "{{ (http_ok_results | length) > 0 }}"
        http_ok_port: "{{ (http_ok_results | first).item | default('N/A') }}"


    - name: Debug risultati curl (porta -> http_code)
      ansible.builtin.debug:
        msg:
          - "Host applicativo: {{ app_host }}"
          - "Risultati (porta->code): {{ curl_results.results | map(attribute='item') | zip(curl_results.results | map(attribute='stdout')) | list }}"
          - "Almeno una porta 200?: {{ http_ok }}"
          - "Prima porta 200: {{ http_ok_port }}"

    - name: Fallisce se nessuna porta risponde 200
      ansible.builtin.fail:
        msg: >-
          ❌ Nessuna porta applicativa risponde HTTP {{ success_http_code }}.
          URL base: {{ app_scheme }}://{{ app_host }}:<PORT>{{ app_path }}
          Porte testate: {{ java_ports }}
          Risultati (porta->code): {{ curl_results.results | map(attribute='item') | zip(curl_results.results | map(attribute='stdout')) | list }}
      when: not http_ok

    - name: OK - trovata almeno una porta con HTTP 200
      ansible.builtin.debug:
        msg: "✅ Applicazione OK su porta {{ http_ok_port }} ({{ app_scheme }}://{{ app_host }}:{{ http_ok_port }}{{ app_path }})"

