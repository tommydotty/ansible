---
# tasks file for kubernetes
- name: Acquisizione namespace
  command: kubectl get vm -A -o json
  register: vm_all

- name: Acquisizione oggetto vm
  set_fact: 
    vm_obj: >-
      {{
        (vm_all.stdout | from_json)['items']
        | selectattr('metadata.name', 'equalto', vm_name)
        | list
        | first
      }}

- name: check vm
  assert:
    that:
      - vm_obj is defined
      - vm_obj != {}
    fail_msg: "VM {{ vm_name }} non trovata"

# --- Services ---
- name: Acquisizione lista svc completa in JSON
  command: kubectl get svc -n "{{ vm_obj.metadata.namespace }}" -o json
  register: svc_json

- name: Creazione lista svc_obj_list
  set_fact:
    svc_obj_list: "{{ (svc_json.stdout | from_json)['items']| default([]) }}"

- name: Creazione variabili dinamiche per ogni Service
  set_fact:
    svc_dynamic: "{{ svc_dynamic | default({}) | combine({ ('svc_' ~ (idx + 1) ~ '_array'): item }) }}"
  loop: "{{ svc_obj_list }}"
  loop_control:
    index_var: idx

# --- PVC ---
- name: Acquisizione lista pvc completa in JSON
  command: kubectl get pvc -n "{{ vm_obj.metadata.namespace }}" -o json
  register: pvc_json

- name: Creazione lista pvc_obj_list
  set_fact:
    pvc_obj_list: "{{ (pvc_json.stdout | from_json)['items']| default([]) }}" 

- name: Creazione variabili dinamiche per ogni PVC
  set_fact:
    pvc_dynamic: "{{ pvc_dynamic | default({}) | combine({ ('pvc_' ~ (idx + 1) ~ '_array'): item }) }}"
  loop: "{{ pvc_obj_list }}"
  loop_control:
    index_var: idx

#--- Lista VM come dict ---
- name: Costruisci lista debug VM
  set_fact:
    debug_vm_list:
      - type: "VM"
        obj: "{{ vm_obj }}"

# --- Lista Services come dict ---
- name: Costruisci lista debug Services
  set_fact:
    debug_svc_list: []
- name: Aggiungi ogni Service a debug_svc_list
  set_fact:
    debug_svc_list: "{{ debug_svc_list + [{'type': 'Service', 'obj': item}] }}"
  loop: "{{ svc_obj_list | default([]) }}"

# --- Lista PVC come dict ---
- name: Costruisci lista debug PVC
  set_fact:
      debug_pvc_list: []
- name: Aggiungi ogni PVC a debug_pvc_list
  set_fact:
    debug_pvc_list: "{{ debug_pvc_list + [{'type': 'PVC', 'obj': item}] }}"
  loop: "{{ pvc_obj_list | default([]) }}"

# --- Loop unico per debug completo JSON ---
- name: Mostra tutte le risorse della VM in formato JSON
  debug:
    msg: "{{ item.type }}:\n{{ item.obj | to_nice_json }}"
  loop: "{{ debug_vm_list + debug_svc_list + debug_pvc_list }}"
