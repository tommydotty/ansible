---
- name: Patch service kubernetes aggiungendo una porta
  hosts: all
  gather_facts: no
    
  vars:
    vm_name: "{{ vm }}"
    service_port: "{{ port }}"
    service_protocol: "{{ protocoll }}"
                  
  tasks:

    - name: login
      command: dlogin
                    
    - name: Recupera namespace della VM
      shell: "kubectl get ns | grep {{ vm }} | awk '{print $1}'"
      register: vm_namespace
      changed_when: false
                                                          
    - name: Verifica namespace trovato
      fail:
        msg: "Namespace non trovato per la VM {{ vm_name }}"
      when: vm_namespace.stdout == ""
                                                                                  
    - name: Recupera service con protocollo richiesto
      shell: >
        kubectl get svc -n {{ vm_namespace.stdout }} -o json |
        jq -r '
          .items[]
          | select(.spec.ports[].protocol=="{{ service_protocol }}")
          | .metadata.name
        '
      register: svc_name
      changed_when: false
                                                                                                                                                              
    - name: Verifica service trovata
      fail:
        msg: "Service con protocollo {{ service_protocol }} non trovata"
      when: svc_name.stdout == ""
                                                                                                                                                                                      
    - name: Patch service aggiungendo la porta
      command: kubectl patch svc -n {{ vm_namespace.stdout }} {{ svc_name.stdout }} --type='json' -p='[{"op":"add","path":"/spec/ports/-","value":{"name":"{{ service_port }}","port":{{ service_port }},"protocol":"{{ service_protocol }}","targetPort":{{ service_port }}}}]'
