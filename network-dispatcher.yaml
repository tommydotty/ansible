---
- name: Deploy NetworkManager dispatcher script (update /etc/hosts)
  hosts: all
  become: true
  gather_facts: false

  vars:
    nm_dispatcher_dir: /etc/NetworkManager/dispatcher.d
    nm_dispatcher_script: 86-update-hosts
    nm_dispatcher_path: "{{ nm_dispatcher_dir }}/{{ nm_dispatcher_script }}"

  handlers:
    - name: restart NetworkManager
      ansible.builtin.service:
        name: NetworkManager
        state: restarted

  tasks:
    - name: Ensure dispatcher directory exists
      ansible.builtin.file:
        path: "{{ nm_dispatcher_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy dispatcher script from ~/.ansible/files
      ansible.builtin.copy:
        src: "{{ nm_dispatcher_script }}"
        dest: "{{ nm_dispatcher_path }}"
        owner: root
        group: root
        mode: "0755"
      notify: restart NetworkManager
